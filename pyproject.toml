[project]
name = "ha-battery-soc"
version = "0.3.0"
description = "Home Assistant integration: battery state of charge by coulomb counting with full/empty anchors"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.357",  # = Home Assistant 2026.8.3
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
